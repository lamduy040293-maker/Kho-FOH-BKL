<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kho FOH BKL - Quản Lý Kho Song Song</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        .active-tab { border-bottom: 3px solid #2563eb; color: #2563eb; font-weight: bold; }
        .active-nav { color: #2563eb; font-weight: bold; }
        body { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans pb-20 md:pb-6">

    <!-- Header & Realtime Clock -->
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div>
                <h1 class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <i class="fa-solid fa-boxes-stacked text-blue-400"></i> Kho FOH BKL
                </h1>
                <p id="syncStatus" class="text-xs text-emerald-400 font-semibold">🟢 Đang kết nối Cloud...</p>
            </div>
            <div class="text-right flex items-center gap-3">
                <div>
                    <div id="clockTime" class="text-lg font-mono font-bold text-emerald-400">00:00:00</div>
                    <div id="clockDate" class="text-xs text-slate-400">01/01/2026</div>
                </div>
                <button onclick="fetchCloudData()" class="bg-blue-600 hover:bg-blue-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold shadow transition-all" title="Tải lại dữ liệu mới nhất">
                    <i class="fa-solid fa-rotate"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Desktop Navigation -->
    <nav class="bg-white border-b border-slate-200 hidden md:block">
        <div class="max-w-6xl mx-auto flex space-x-8 px-4">
            <button onclick="switchTab('tonkho')" id="dt-tab-tonkho" class="py-3 px-2 active-tab"><i class="fa-solid fa-chart-pie mr-1"></i> Tồn Kho</button>
            <button onclick="switchTab('giaodich')" id="dt-tab-giaodich" class="py-3 px-2 text-slate-600 hover:text-blue-600"><i class="fa-solid fa-arrow-right-arrow-left mr-1"></i> Giao Dịch</button>
            <button onclick="switchTab('sanpham')" id="dt-tab-sanpham" class="py-3 px-2 text-slate-600 hover:text-blue-600"><i class="fa-solid fa-list-check mr-1"></i> Quản Lý Mặt Hàng</button>
            <button onclick="switchTab('lichsu')" id="dt-tab-lichsu" class="py-3 px-2 text-slate-600 hover:text-blue-600"><i class="fa-solid fa-clock-rotate-left mr-1"></i> Lịch Sử</button>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto p-4">

        <!-- TAB 1: TỒN KHO -->
        <section id="sec-tonkho" class="space-y-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-3 bg-white p-4 rounded-xl shadow-sm border border-slate-200">
                <div class="flex items-center gap-2">
                    <span class="text-sm font-semibold text-slate-600">Lọc theo nhóm:</span>
                    <select id="filterCategory" onchange="renderStock()" class="border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 focus:outline-blue-500">
                        <option value="ALL">Tất cả nhóm</option>
                    </select>
                </div>
                <div class="flex gap-2 text-xs">
                    <span class="px-2 py-1 bg-emerald-100 text-emerald-800 font-semibold rounded">An Toàn</span>
                    <span class="px-2 py-1 bg-amber-100 text-amber-800 font-semibold rounded">⚠️ Bán Thiếu</span>
                    <span class="px-2 py-1 bg-rose-100 text-rose-800 font-semibold rounded">⚠️ Tổng Thiếu</span>
                </div>
            </div>
            <div id="stockContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
        </section>

        <!-- TAB 2: GIAO DỊCH -->
        <section id="sec-giaodich" class="hidden space-y-4">
            <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 max-w-2xl mx-auto">
                <h2 class="text-lg font-bold text-slate-800 mb-4 border-b pb-2 flex items-center gap-2">
                    <i class="fa-solid fa-square-plus text-blue-600"></i> Tạo Giao Dịch Kho
                </h2>
                <form id="transForm" onsubmit="handleTransaction(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Thời Gian Giao Dịch</label>
                            <input type="date" id="transDate" required class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Loại Giao Dịch</label>
                            <select id="transType" class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50 font-semibold">
                                <option value="nhap_tong">📥 Nhập Kho Tổng (Từ NCC)</option>
                                <option value="chuyen_kho">🔄 Xuất Tổng ➔ Nhập Kho Bán</option>
                                <option value="xuat_ban">📤 Xuất Kho Bán (Tiêu hao / Bán)</option>
                            </select>
                        </div>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Chọn Mặt Hàng</label>
                            <select id="transItem" required class="w-full border border-slate-300 rounded-lg p-2 text-sm bg-slate-50"></select>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-600 mb-1">Số Lượng Xuất/Nhập</label>
                            <input type="number" id="transQty" min="1" value="1" required class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 mb-1">Ghi Chú</label>
                        <input type="text" id="transNote" placeholder="Diễn giải thêm..." class="w-full border border-slate-300 rounded-lg p-2 text-sm">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-
